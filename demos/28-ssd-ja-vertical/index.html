<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#E9EEF2}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#E9EEF2}
#world{position:absolute;left:0;top:0;width:1080px;height:8000px;transform-origin:0 0}
#dots{position:absolute;left:-4000px;top:-3000px;width:9080px;height:14000px;
  background-image:radial-gradient(circle,#C5CFD8 2.3px,transparent 2.9px);background-size:48px 48px}
.a{position:absolute;left:0;top:0}
.jp{font-family:'Noto Sans JP',sans-serif}
.in{font-family:'Inter',sans-serif;font-feature-settings:'tnum' 1}
.mask{position:absolute;overflow:hidden}
.stk{position:absolute;left:0;top:0;transform-origin:50% 50%}
#dim,#hud{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
</style></head>
<body><div id="stage">
  <div id="world"><div id="dots"></div></div>
  <div id="dim"></div>
  <div id="hud"></div>
</div>
<script type="module">
const ROOT='/demos/28-ssd-ja-vertical/';
const C=await fetch(ROOT+'cues.json').then(r=>r.json()); const EV=C.ev, CAM=C.cam;
window.DEMO={width:1080,height:1920,fps:30,duration:C.duration};
// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x, lerp=(a,b,u)=>a+(b-a)*u, P=(t,a,d)=>clamp((t-a)/d);
const oC=u=>1-Math.pow(1-u,3), oQ=u=>1-Math.pow(1-u,4), oX=u=>u>=1?1:1-Math.pow(2,-10*u), iQ=u=>u*u,
  ioC=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2, ioS=u=>-(Math.cos(Math.PI*u)-1)/2,
  oB=(u,s=1.7)=>1+(s+1)*Math.pow(u-1,3)+s*Math.pow(u-1,2);
function bez(x1,y1,x2,y2){return u=>{if(u<=0)return 0;if(u>=1)return 1;let t=u;for(let i=0;i<8;i++){const cx=3*x1*t*(1-t)**2+3*x2*t*t*(1-t)+t**3-u;const d=3*x1*(1-t)**2+6*(x2-x1)*t*(1-t)+3*(1-x2)*t*t;if(Math.abs(d)<1e-6)break;t=clamp(t-cx/d);}return 3*y1*t*(1-t)**2+3*y2*t*t*(1-t)+t**3;};}
const eFly=bez(.62,0,.22,1), ePull=bez(.5,0,.08,1);
const wob=(dt,f=5,k=11)=>dt<0?0:Math.exp(-k*dt)*Math.cos(2*Math.PI*f*dt);
const mixc=(a,b,u)=>{const A=a.match(/\w\w/g).map(h=>parseInt(h,16)),B=b.match(/\w\w/g).map(h=>parseInt(h,16));return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],u))).join(',')})`;};
const INK='#25313D', MID='#8C9AA8', SUB='#5E6D7B', CARD='#F7F9FB', LINE='#CDD6DE', BLUE='#3D7BE0', OR='#FF5A36', SLATE='#D3DCE4';
const W=document.getElementById('world'), HUD=document.getElementById('hud'), DIM=document.getElementById('dim');
const el=(tag,cls,parent,css,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;(parent||W).appendChild(e);return e;};
const U=[];
const shadow=(lift,a=.26)=>`drop-shadow(0 ${6+34*lift}px ${10+34*lift}px rgba(22,34,46,${(a-0.08*lift).toFixed(3)}))`;
// sticker slap: falls in from above the paper, lands, wobbles
function slap(t,land,dur=.22,amp=.3){const p=(t-(land-dur))/dur;if(p<0)return{o:0,s:1+amp,r:6,lift:1};
  if(p<1){const L=1-iQ(p);return{o:clamp(p*5),s:1+amp*L,r:6*L,lift:L};}
  const w=wob(t-land,4.5,10);return{o:1,s:1-.035*w,r:-.8*w,lift:0};}
const fadeUp=(e,t,a,dy=18,d=.38)=>{const k=oC(P(t,a,d));e.style.opacity=k;e.style.transform=`translateY(${(1-k)*dy}px)`;};
const revealUp=(inner,t,a,h,d=.5)=>{inner.style.transform=`translateY(${(1-oX(P(t,a,d)))*h}px)`;};
function kicker(x,y,txt,en,parent=W){return el('div','a jp',parent,`left:${x}px;top:${y}px;font:700 32px/1 'Noto Sans JP';color:${INK};white-space:nowrap`,
  `<span style="display:inline-block;width:22px;height:22px;background:${OR};margin-right:16px;vertical-align:-2px"></span>${txt}<span style="font:600 22px Inter;letter-spacing:.18em;color:${MID};margin-left:20px">${en}</span>`);}
function maskLine(x,y,w,h,css,html,parent=W){const m=el('div','mask',parent,`left:${x-10}px;top:${y}px;width:${w}px;height:${h}px`);const i=el('div','a jp',m,`left:10px;top:0;white-space:nowrap;${css}`,html);return{m,i};}
const fmt=n=>String(Math.round(n));

// ---------- sticker art (white die-cut outline + art) ----------
const OUT=`fill="#F7F9FB" stroke="#F7F9FB" stroke-linejoin="round"`;
const ssdSVG=`<svg viewBox="-30 -30 860 280" width="860" height="280" style="overflow:visible">
 <rect x="0" y="0" width="800" height="220" rx="14" ${OUT} stroke-width="40"/>
 <rect x="0" y="0" width="800" height="220" rx="14" fill="#1E5E3E"/>
 <g fill="none" stroke="#2F7E55" stroke-width="3" opacity=".9">
  <path d="M200 70 H240 L252 58 M200 110 H250 M200 150 H240 L252 162 M450 60 H475 M450 110 H480 M450 160 H475 M670 70 H720 L735 85 M670 150 H720 L735 135 M40 40 H70 M40 180 H70"/></g>
 <circle cx="0" cy="110" r="24" fill="#F7F9FB"/><circle cx="0" cy="110" r="13" fill="#B9C3CC"/>
 <g fill="#D9B45B">${[...Array(13)].map((_,i)=>{const y=16+i*15;return (y>136&&y<160)?'':`<rect x="742" y="${y}" width="58" height="9" rx="2"/>`;}).join('')}</g>
 <rect x="80" y="52" width="116" height="116" rx="8" fill="#14181D"/><rect x="80" y="52" width="116" height="116" rx="8" fill="none" stroke="#39424C" stroke-width="2"/>
 <circle cx="96" cy="68" r="5" fill="#2A3138"/>
 <rect x="252" y="28" width="196" height="164" rx="8" fill="#14181D"/><rect x="470" y="28" width="196" height="164" rx="8" fill="#14181D"/>
 <rect x="262" y="62" width="394" height="96" rx="8" fill="#F7F9FB"/>
 <text x="290" y="114" font-family="Inter" font-weight="900" font-size="46" fill="#25313D" letter-spacing="2">VELO</text>
 <rect x="436" y="80" width="200" height="34" rx="6" fill="#FF5A36"/>
 <text x="536" y="104" font-family="Inter" font-weight="800" font-size="22" fill="#fff" text-anchor="middle" letter-spacing="1">NVMe SSD</text>
 <text x="290" y="143" font-family="Inter" font-weight="600" font-size="19" fill="#5E6D7B" letter-spacing="2">M.2 2280 · 500GB</text>
</svg>`;
const osSVG=`<svg viewBox="-90 -76 180 152" width="180" height="152" style="overflow:visible">
 <rect x="-76" y="-60" width="152" height="120" rx="16" ${OUT} stroke-width="26"/>
 <rect x="-76" y="-60" width="152" height="120" rx="16" fill="#25313D"/>
 <circle cx="-56" cy="-42" r="6" fill="#FF5A36"/><circle cx="-38" cy="-42" r="6" fill="#8C9AA8"/><circle cx="-20" cy="-42" r="6" fill="#8C9AA8"/>
 <rect x="-62" y="-26" width="124" height="74" rx="8" fill="#3D7BE0"/>
 <text x="0" y="26" font-family="Inter" font-weight="900" font-size="46" fill="#fff" text-anchor="middle">OS</text></svg>`;
const buoySVG=`<svg viewBox="-80 -80 160 160" width="160" height="160" style="overflow:visible">
 <circle r="64" ${OUT} stroke-width="26"/>
 <circle r="64" fill="#FF5A36"/>
 <g fill="#F7F9FB">${[0,90,180,270].map(a=>`<path d="M 0 0 L ${64*Math.cos((a-20)*Math.PI/180)} ${64*Math.sin((a-20)*Math.PI/180)} A 64 64 0 0 1 ${64*Math.cos((a+20)*Math.PI/180)} ${64*Math.sin((a+20)*Math.PI/180)} Z"/>`).join('')}</g>
 <circle r="30" fill="#E9EEF2"/><circle r="30" fill="none" stroke="#25313D" stroke-width="5"/><circle r="64" fill="none" stroke="#25313D" stroke-width="5"/></svg>`;
const updSVG=`<svg viewBox="-80 -80 160 160" width="160" height="160" style="overflow:visible">
 <circle r="62" ${OUT} stroke-width="26"/>
 <circle r="62" fill="#25313D"/>
 <g fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"><path d="M -34 -12 A 36 36 0 0 1 30 -20"/><path d="M 34 12 A 36 36 0 0 1 -30 20"/></g>
 <path d="M 18 -40 L 42 -18 L 12 -10 Z" fill="#fff"/><path d="M -18 40 L -42 18 L -12 10 Z" fill="#fff"/></svg>`;
const PAD='M -50 -24 H 50 A 34 34 0 0 1 83 4 L 90 36 A 20 20 0 0 1 56 52 L 34 28 H -34 L -56 52 A 20 20 0 0 1 -90 36 L -83 4 A 34 34 0 0 1 -50 -24 Z';
const padGlyph=(col,hole)=>`<path d="${PAD}" fill="${col}"/><rect x="-60" y="-4" width="34" height="11" rx="3" fill="${hole}"/><rect x="-48" y="-16" width="11" height="34" rx="3" fill="${hole}"/><circle cx="44" cy="-6" r="7" fill="${hole}"/><circle cx="58" cy="8" r="7" fill="${hole}"/>`;
const padSVG=(w,col,hole)=>`<svg viewBox="-96 -40 192 100" width="${w}" height="${w*100/192}" style="overflow:visible">${padGlyph(col,hole)}</svg>`;
const folderGlyph=`<path d="M -60 -40 H -18 L -6 -28 H 60 A 8 8 0 0 1 68 -20 V 40 A 8 8 0 0 1 60 48 H -60 A 8 8 0 0 1 -68 40 V -32 A 8 8 0 0 1 -60 -40 Z" fill="#fff"/>
 <path d="M -44 34 L -16 4 L 4 24 L 18 12 L 44 34 Z" fill="#6E7F92"/><circle cx="26" cy="-6" r="9" fill="#6E7F92"/>`;

// ---------- camera ----------
function camAt(t){if(t<=CAM[0].t)return{...CAM[0]};
 for(let i=1;i<CAM.length;i++){const a=CAM[i-1],b=CAM[i];if(t>b.t)continue;const u=(t-a.t)/(b.t-a.t);
  if(b.m==='fly'){const e=eFly(u);return{x:lerp(a.x,b.x,e),y:lerp(a.y,b.y,e),z:Math.exp(lerp(Math.log(a.z),Math.log(b.z),e))*(1-(b.dip||.15)*Math.sin(Math.PI*e))};}
  if(b.m==='pull'){const e=ePull(u);return{x:lerp(a.x,b.x,e),y:lerp(a.y,b.y,e),z:Math.exp(lerp(Math.log(a.z),Math.log(b.z),e))};}
  const e=ioS(u);return{x:lerp(a.x,b.x,e),y:lerp(a.y,b.y,e),z:lerp(a.z,b.z,e)};}
 return{...CAM[CAM.length-1]};}
const jolt=t=>7*wob(t-EV.ssd_land,4,15)+5*wob(t-EV.sys_slam,4,16)+3*(wob(t-EV.games[0],4,18)+wob(t-EV.games[1],4,18)+wob(t-EV.games[2],4,18))+10*wob(t-EV.stamp,4,14)+5*wob(t-EV.reco[0],4,16);


// ===================================================================== vertical layout (1080×1920 viewport, 80 px side margins)
const L=96, CWID=840;   // safe area ≈ x 64–1016, y 112–1808 (bar + 30 GB overflow must end inside it)
const lead=document.createElementNS('http://www.w3.org/2000/svg','svg');lead.setAttribute('width',1080);lead.setAttribute('height',8000);lead.style.cssText='position:absolute;left:0;top:0;overflow:visible;z-index:7';W.appendChild(lead);
const sv=(tag,attrs)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const k in attrs)e.setAttribute(k,attrs[k]);lead.appendChild(e);return e;};
const CAPF=`font:900 70px/1.4 'Noto Sans JP';color:${INK}`;

// =========================================================== A: title
const aK=kicker(L,1010,'PCパーツ解説','');
const aL1=maskLine(L,1060,960,150,`font:900 112px/1.2 'Noto Sans JP';color:${INK};letter-spacing:-.01em`,'SSDの容量、');
const aL2=maskLine(L,1205,960,160,`font:900 112px/1.2 'Noto Sans JP';color:${INK};letter-spacing:-.01em`,'全部は使えない？');
const aMark=el('div','a',aL2.m,`left:10px;top:108px;height:28px;width:224px;background:${OR};transform-origin:0 50%`);
aL2.m.insertBefore(aMark,aL2.i);
const aSub=el('div','a in',W,`left:${L}px;top:1400px;font:600 24px/1 Inter;letter-spacing:.12em;color:${MID};white-space:nowrap`,'');
const aRule=el('div','a',W,`left:${L}px;top:1404px;width:560px;height:3px;background:${INK};transform-origin:0 50%`);
const aNote=el('div','a jp',W,`left:${L}px;top:1430px;font:500 36px/1.5 'Noto Sans JP';color:${SUB};white-space:nowrap`,'500GB・1TB・2TB、どれを選べばいい？');
const ssd=el('div','stk',W,'width:860px;height:280px;z-index:20',ssdSVG);
const SSD0={x:540,y:660,s:.98,r:-12};
U.push(t=>{
 fadeUp(aK,t,EV.kicker);revealUp(aL1.i,t,EV.title1,150);revealUp(aL2.i,t,EV.title2,160);
 aMark.style.transform=`scaleX(${ioC(P(t,EV.marker[0],EV.marker[1]-EV.marker[0]))})`;
 const s=oC(P(t,EV.sub,.4));aSub.style.opacity=s;aSub.style.transform=`translateX(${(1-s)*-30}px)`;
 aRule.style.transform=`scaleX(${oQ(P(t,EV.sub+.08,.5))})`;fadeUp(aNote,t,EV.note,14);
 const sl=slap(t,EV.ssd_land,.24,.35),fl=oC(P(t,.5,.6)),fy=Math.sin((t-.5)*2.4)*8*fl,fr=Math.sin((t-.5)*1.9+.4)*1.2*fl;
 ssd.style.opacity=sl.o;ssd.style.transform=`translate(${SSD0.x-430}px,${SSD0.y-140-fy-300*sl.lift}px) rotate(${SSD0.r+sl.r*2+fr}deg) scale(${SSD0.s*sl.s})`;
 ssd.style.filter=shadow(Math.max(sl.lift,.12*fl*(.5+.5*Math.sin((t-.5)*2.4))));
});

// =========================================================== B: system data (y 2000–3920)
const B={x0:L,y:3120,w:CWID,h:200,gb:CWID/500};
const SYS_B=90, USE_B=410;
const bK=kicker(L,2190,'中身は空っぽじゃない','');
const bCap1=maskLine(L,2250,960,110,CAPF,'SSDには、最初から');
const bCap2=maskLine(L,2360,960,110,CAPF,`<span style="color:${OR}">システムデータ</span>が入っている`);
const bBar=el('div','a',W,`left:${B.x0}px;top:${B.y}px;width:${B.w}px;height:${B.h}px;border-radius:22px;background:${CARD};box-shadow:inset 0 0 0 3px ${LINE};overflow:hidden;z-index:5`);
const bFill=el('div','a',bBar,`left:0;top:0;width:${B.w}px;height:${B.h}px;background:${SLATE};transform-origin:0 50%`);
const bUse=el('div','a',bBar,`left:${SYS_B*B.gb}px;top:0;width:${USE_B*B.gb}px;height:${B.h}px;background:${BLUE};opacity:0`);
const bUseT=el('div','a jp',bBar,`left:${SYS_B*B.gb}px;top:0;width:${USE_B*B.gb}px;height:${B.h}px;display:flex;align-items:center;justify-content:center;color:#fff;font:900 54px/1 'Noto Sans JP';white-space:nowrap;opacity:0`,'実際に使える部分');
const bSys=el('div','a',bBar,`left:0;top:0;width:${SYS_B*B.gb}px;height:${B.h}px;background:${INK};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff`,
 `<span class="jp" style="font:900 32px/1 'Noto Sans JP'">システム</span><span class="in" style="font:700 26px/1 Inter;color:#C5CFD8">約90GB</span>`);
const bTick0=el('div','a in',W,`left:${B.x0}px;top:${B.y+B.h+18}px;font:600 30px/1 Inter;color:${MID}`,'0');
const bTick1=el('div','a in',W,`left:${B.x0+B.w-160}px;top:${B.y+B.h+18}px;width:160px;text-align:right;font:700 30px/1 Inter;color:${MID}`,'500GB');
const bNumWrap=el('div','a',W,`left:${L}px;top:2530px;width:920px;height:250px;z-index:6`);
const bLab=el('div','a jp',bNumWrap,`left:0;top:0;font:700 36px/1 'Noto Sans JP';color:${SUB};white-space:nowrap`,'SSDの容量');
const bNum=el('div','a in',bNumWrap,`left:-6px;top:46px;font:900 190px/1 Inter;letter-spacing:-.045em;color:${INK};white-space:nowrap`,'0GB');
const ICONS=[{svg:osSVG,w:180,h:152,x:230,y:2900,r:-6,lab:'OS本体',s:.95},{svg:buoySVG,w:160,h:160,x:540,y:2890,r:5,lab:'回復領域',s:.95},{svg:updSVG,w:160,h:160,x:850,y:2900,r:-4,lab:'更新・一時ファイル',s:.95}];
ICONS.forEach((o,i)=>{o.node=el('div','stk',W,`width:${o.w}px;height:${o.h}px;z-index:9`,o.svg);o.land=EV.icons[i];
 o.line=sv('path',{d:`M ${o.x} ${o.y+122} L ${L+SYS_B*B.gb/2+(i-1)*36} ${B.y-6}`,fill:'none',stroke:INK,'stroke-width':4,'stroke-linecap':'round',pathLength:1,'stroke-dasharray':'1 1'});
 o.labE=el('div','a jp',W,`left:${o.x-200}px;top:${o.y+74}px;width:400px;text-align:center;font:700 30px/1 'Noto Sans JP';color:${INK};white-space:nowrap;z-index:10`,o.lab);});
const bSubE=el('div','a jp',W,`left:${L}px;top:3420px;font:900 66px/1.32 'Noto Sans JP';color:${INK};white-space:nowrap`,
 `<span style="color:${OR}">→</span> 全ての容量を<br>　 使えるわけではない`);
const bFoot=el('div','a jp',W,`left:${L}px;top:3650px;font:500 24px/1.6 'Noto Sans JP';color:${MID};white-space:nowrap`,'※ システム分はGB表記の換算差（約35GB）を含む目安。<br>　 OS・機種・使い方により異なります。');
U.push(t=>{
 fadeUp(bK,t,EV.b_head);revealUp(bCap1.i,t,EV.b_cap,110);revealUp(bCap2.i,t,EV.b_cap+.12,110);
 const g=bez(.3,0,.15,1)(P(t,EV.grow[0],EV.grow[1]-EV.grow[0]));bFill.style.transform=`scaleX(${g})`;
 bBar.style.opacity=oC(P(t,EV.b_head+.1,.4));[bTick0,bTick1].forEach(e=>e.style.opacity=oC(P(t,EV.grow[1]-.1,.3)));
 const ss=P(t,EV.sys_slam-.16,.16), sw=wob(t-EV.sys_slam,5,12);
 bSys.style.transform=`translateX(${t<EV.sys_slam?-SYS_B*B.gb*(1-iQ(ss)):-8*sw}px)`;bSys.style.opacity=ss>0?1:0;
 const us=oC(P(t,EV.sys_slam+.05,.35));bUse.style.opacity=us;
 fadeUp(bUseT,t,EV.usable,12,.35);
 bBar.style.transform=`translateX(${t>=EV.sys_slam?10*wob(t-EV.sys_slam,6,14):0}px)`;
 let n=500*g,pre='',col=INK;
 if(t>=EV.count_down[0]){const d=ioC(P(t,EV.count_down[0],EV.count_down[1]-EV.count_down[0]));n=lerp(500,410,d);pre='約';col=mixc('25313D','3D7BE0',d);}
 bNum.innerHTML=`${pre?`<span class="jp" style="font:900 96px Noto Sans JP;vertical-align:44px;margin-right:8px">${pre}</span>`:''}${fmt(n)}<span style="font:900 90px Inter;margin-left:8px">GB</span>`;
 bNum.style.color=col;bLab.textContent=t>=EV.count_down[0]?'実際に使える容量':'SSDの容量';bLab.style.color=t>=EV.count_down[0]?BLUE:SUB;
 bNumWrap.style.opacity=oC(P(t,EV.b_head+.2,.4));
 bNum.style.transformOrigin='0 70%';bNum.style.transform=`scale(${1+.05*wob(t-EV.count_down[1],4,9)*(t>=EV.count_down[1]?1:0)})`;
 ICONS.forEach((o,i)=>{const sl=slap(t,o.land,.2,.4);o.node.style.opacity=sl.o;
  o.node.style.transform=`translate(${o.x-o.w/2}px,${o.y-o.h/2-140*sl.lift}px) rotate(${o.r+sl.r*2}deg) scale(${o.s*sl.s})`;o.node.style.filter=shadow(sl.lift);
  o.line.setAttribute('stroke-dashoffset',1-oC(P(t,o.land+.02,.22)));const lq=oC(P(t,o.land+.06,.25));o.labE.style.opacity=lq;o.labE.style.transform=`translateY(${(1-lq)*12}px)`;});
 fadeUp(bSubE,t,EV.b_sub,16,.4);bFoot.style.opacity=oC(P(t,EV.b_sub+.15,.4));
});

// =========================================================== C: 500GB overflows (y 4000–5920)
const Cc={x0:L,y:4880,w:CWID,h:200,gb:CWID/500};
const cK=kicker(L,4190,'500GBの場合','');
const cCap1=maskLine(L,4250,960,110,CAPF,'大作ゲームは、<span class="in" style="font-weight:900">1</span>本で');
const cCap2=maskLine(L,4360,960,110,CAPF,`<span style="color:${OR}">100GB超え</span>も当たり前`);
const cBar=el('div','a',W,`left:${Cc.x0}px;top:${Cc.y}px;width:${Cc.w}px;height:${Cc.h}px;border-radius:22px;background:${CARD};box-shadow:inset 0 0 0 3px ${LINE};z-index:5`);
